name: utbot-watch
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run shadow engine
        run: node watch.js
      - name: Commit state if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "utbot-watch-bot"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "watch: $(git diff --cached --stat | tail -1) [skip ci]"
            git push
          else
            echo "no change"
          fi
